<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gemBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142820"/>
      <stop offset="100%" stop-color="#244537"/>
    </linearGradient>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="gemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#gemBg)" stroke="#60a5fa" stroke-width="2.5" filter="url(#gemShadow)"/>

  <!-- Brilho / Estrela de 4 pontas do Gemini -->
  <path d="M 32 10 Q 32 28 50 32 Q 32 36 32 54 Q 32 36 14 32 Q 32 28 32 10 Z" fill="url(#gemGrad)"/>
  <circle cx="32" cy="32" r="3.5" fill="#ffffff"/>
  
